services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: makeutility
      POSTGRES_PASSWORD: makeutility
      POSTGRES_DB: makeutility
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makeutility"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://makeutility:makeutility@postgres:5432/makeutility?sslmode=disable
      MAKEUTILITY_API_KEY: ${MAKEUTILITY_API_KEY:-dev-local-only-key}
      MAKEUTILITY_API_ADDR: ":8080"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
